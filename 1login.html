<!DOCTYPE html>
<html>
<head>
    <title>MediCare - Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f1fbfa;
            color: #17354a;
        }

        /* Header */
        header {
            height: 90px;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            box-sizing: border-box;
            border-bottom: 1px solid #e0eeee;
        }

        .logo {
            display: flex;
            align-items: center;
            font-size: 36px;
            font-weight: bold;
        }

        .logo-icon {
            background-color: #18a58e;
            color: white;
            width: 52px;
            height: 52px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 18px;
            font-size: 28px;
        }

        /* Main */
        .container {
            min-height: calc(100vh - 90px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background-color: white;
            width: 400px;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .login-box h2 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
            color: #17354a;
        }

        .subtitle {
            text-align: center;
            color: #71818c;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #17354a;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 1px solid #ccd9dd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #18a58e;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background-color: #18a58e;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #148d79;
        }

        .forgot {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 25px;
        }

        .forgot a {
            color: #18a58e;
            text-decoration: none;
        }

        .signup {
            text-align: center;
            margin-top: 25px;
            color: #71818c;
        }

        .signup a {
            color: #18a58e;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <div class="logo-icon">+</div>
            MediCare
        </div>
    </header>

    <!-- Login Section -->
    <div class="container">

        <div class="login-box">

            <h2>Welcome Back</h2>

            <p class="subtitle">
                Login to your MediCare account
            </p>

            <form>

                <label>Email Address</label>
                <input type="email" placeholder="Enter your email">

                <label>Password</label>
                <input type="password" placeholder="Enter your password">

                <div class="forgot">
                    <a href="#">Forgot Password?</a>
                </div>

                <button class="login-btn" type="submit">
                    Login
                </button>

            </form>

            <p class="signup">
                Don't have an account?
                <a href="#">Create Account</a>
            </p>

        </div>

    </div>

</body>
</html>
